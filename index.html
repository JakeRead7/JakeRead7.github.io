<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake | Personal Website</title>
  <!-- Fonts: Fraunces for headings, Outfit for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation bar -->
  <nav class="navbar">
    <span class="logo">Jake</span>
    <ul>
      <li><a href="#about">About Me</a></li>
      <li><a href="#gallery">Gallery</a></li>
    </ul>
  </nav>

  <!-- Header -->
  <header class="hero">
    <h1>Hi, I'm Jake</h1>
    <p class="tagline">Welcome to my corner of the internet</p>
  </header>

  <!-- ABOUT ME: replace the text in the paragraphs below with your own info -->
  <section id="about" class="card">
    <h2>About Me</h2>
    <p>
      [Write about yourself here: where you're from, your school and major, etc.]
    </p>
    <p>
      [Add more here: hobbies, interests, fun facts, goals.]
    </p>
  </section>

  <!-- GALLERY: 3 pictures -->
  <section id="gallery" class="card">
    <h2>Gallery</h2>
    <div class="gallery">
      <figure>
        <img src="golf.jpg" alt="Playing golf with my dad and my good buddy and his dad at the end of summer">
        <figcaption>A day on the course</figcaption>
      </figure>
      <figure>
        <img src="volleyball.jpg" alt="Super fun beach volleyball torunament with the boys">
        <figcaption>Six Man Tournament</figcaption>
      </figure>
      <figure>
        <img src="sunset.jpg" alt="Sunset over a harbor seen from a boat">
        <figcaption>Sunset on the water</figcaption>
      </figure>
    </div>
  </section>

  <footer>
    <p>Made by Jake with HTML &amp; CSS &middot; COMP 150</p>
  </footer>

</body>
</html>
